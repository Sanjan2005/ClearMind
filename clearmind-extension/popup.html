<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearMind</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main class="app">
    <header><div class="logo">✓</div><div><h1>ClearMind</h1><p>Small choices. Stronger habits.</p></div><span class="status">ACTIVE</span></header>
    <section class="hero"><p>CURRENT SCORE</p><div class="score" id="score">—</div><div class="bar"><span id="progress"></span></div><div class="meta"><span>Clean-day streak</span><strong><span id="streak">—</span> days 🔥</strong></div></section>
    <section class="grid"><div class="tile"><span>BEST STREAK</span><strong id="best">—</strong></div><div class="tile"><span>BLOCKED TOTAL</span><strong id="blocked">—</strong></div></section>
    <section class="activity"><h2>Recent activity</h2><div id="events" class="events">Loading…</div></section>
    <footer>Stored on this browser · Search text isn't saved</footer>
  </main>
</body>
</html>
