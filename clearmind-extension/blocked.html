<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearMind — Content blocked</title>
  <link rel="stylesheet" href="blocked.css">
  <script src="blocked.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="shield" aria-hidden="true">✓</div>
    <p class="eyebrow">CLEAR MIND · PROTECTION ACTIVE</p>
    <h1>Let's stay on track.</h1>
    <p class="copy">ClearMind blocked this destination to help you stick to your goals. Take a breath and choose what you want to do next.</p>
    <div class="stats">
      <div><span class="label">CURRENT SCORE</span><strong id="score">—</strong></div>
      <div><span class="label">CLEAN-DAY STREAK</span><strong id="streak">—</strong></div>
    </div>
    <button id="backButton">Go back</button>
    <p class="footnote">A blocked attempt is recorded locally. Your search text is not saved.</p>
  </main>
</body>
</html>
